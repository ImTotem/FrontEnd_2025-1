<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="foundation.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Document</title>
</head>
<body>
    <main class="card">
        <div class="header">
            <h1 class="header-title header-content">로또 번호 생성기</h1>
            <h2 class="header-subtitle header-content">행운의 번호를 생성해보세요!</h2>
        </div>
        <div class="lotto">
            <div class="gen-container">
                <h1 class="section-title">번호 생성</h1>
                <div class="balls">
                    <div class="lotto-ball ball-1">?</div>
                    <div class="lotto-ball ball-2">?</div>
                    <div class="lotto-ball ball-3">?</div>
                    <div class="lotto-ball ball-4">?</div>
                    <div class="lotto-ball ball-5">?</div>
                    <div class="lotto-ball ball-6">?</div>
                </div>
                <button class="gen-button" disabled>번호 생성하기</button>
            </div>
            <div class="buy-container">
                <h2 class="section-title">로또 구매하기</h2>
                <div class="buy-amount">
                    <span class="body-text buy-input-tag">구매 수량:</span>
                    <input class="buy-input" type="number" min="0">
                </div>
                <div class="total-amount">총 금액: 0원 (1장당 1,000원)</div>
                <button class="buy-button">구매하기</button>
            </div>
            <div class="card result-container"">
                <div class="section-title">당첨 결과 확인</div>
                <div class="body-text">이번 주 당첨 번호:</div>
                <div class="balls">
                    <div class="lotto-ball ball-1">3</div>
                    <div class="lotto-ball ball-2">14</div>
                    <div class="lotto-ball ball-3">25</div>
                    <div class="lotto-ball ball-4">33</div>
                    <div class="lotto-ball ball-5">41</div>
                    <div class="lotto-ball ball-6">9</div>
                </div>
                <div class="body-text">내가 구매한 번호:</div>
                <div class="my-lotto">
                    <div class="balls">
                        <div class="lotto-ball ball-1">7</div>
                        <div class="lotto-ball ball-2">12</div>
                        <div class="lotto-ball ball-3">25</div>
                        <div class="lotto-ball ball-4">38</div>
                        <div class="lotto-ball ball-5">42</div>
                        <div class="lotto-ball ball-6">9</div>
                    </div>
                    <div class="card lotto-result">결과: 2개 일치</div>
                </div>
                <div class="my-lotto">
                    <div class="balls">
                        <div class="lotto-ball ball-1">3</div>
                        <div class="lotto-ball ball-2">14</div>
                        <div class="lotto-ball ball-3">25</div>
                        <div class="lotto-ball ball-4">33</div>
                        <div class="lotto-ball ball-5">41</div>
                        <div class="lotto-ball ball-6">9</div>
                    </div>
                    <div class="card lotto-result">결과: 6개 일치 - 당첨</div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
